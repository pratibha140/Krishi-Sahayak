# nginx.conf (Template / Example Configuration)
# Production Reverse Proxy Configuration for Krishi Sahayak
# ==============================================================================
# NOTE: This configuration is a deployable production example template.
# Adjust the static path placeholder (/var/www/krishi-sahayak/static/) to match
# your server's deployment directory before enabling this site.
#
# HTTPS / TLS RESPONSIBILITY:
# In a live production environment, TLS termination (HTTPS on port 443) should be
# managed by Certbot / Let's Encrypt or an infrastructure load balancer.
# Do NOT hardcode fake certificate paths here. A standard HTTP-to-HTTPS redirect
# block can be enabled once certificates are provisioned on the host.
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Maximum upload payload size (matches/exceeds Flask MAX_CONTENT_LENGTH = 8M)
    client_max_body_size 10M;

    # Performance optimizations for static assets
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Direct database & SQLite file protection (Section 6.2 Item 3)
    location ~* \.(db|db-wal|db-shm|sqlite|sqlite3)$ {
        deny all;
        return 404;
    }

    # Direct static file serving (offloads Python Gunicorn workers)
    location /static/ {
        # PLACEHOLDER: Update this path to the absolute location of project static directory
        alias /var/www/krishi-sahayak/static/;

        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Reverse proxy upstream to local Gunicorn WSGI server
    location / {
        proxy_pass http://127.0.0.1:5000;

        # Forwarded client and protocol headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts aligned with Gunicorn 60s timeout for ML inference
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Disable buffering for low-latency streaming/responses
        proxy_buffering off;
    }
}
